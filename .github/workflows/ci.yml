name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y shellcheck zsh
      - uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
      - run: bash scripts/ci-shell.sh

  # Throwaway HOME: the path a machine takes after tools exist.
  # bootstrap.sh itself needs sudo apt and is not this job.
  install:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - run: |
          apt-get update
          apt-get install -y git nodejs jq gettext-base curl ca-certificates
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/ci-install.sh
      - run: bash scripts/ci-compose.sh
      - run: bash scripts/ci-dotfiles.sh

  pwsh:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/powershell:7.4-ubuntu-24.04
    steps:
      - run: apt-get update && apt-get install -y git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pwsh -NoProfile -File scripts/ci-pwsh.ps1
