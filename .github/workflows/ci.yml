name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - uses: mfinelli/setup-shfmt@v3
      - name: shellcheck
        run: |
          mapfile -t files < <(
            git ls-files '*.sh' 'bin/*' 'packages/*' \
              | while read -r f; do
                  head -c 2 "$f" | grep -q '#!' && head -1 "$f" | grep -qE 'sh$|bash' && echo "$f"
                done
          )
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"
      - name: shfmt
        run: shfmt -i 4 -ci -s -d bin/dotfiles bootstrap.sh

  # A throwaway HOME in a bare container, so this is the fresh-machine path
  # rather than a rehearsal of it.
  bootstrap:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - run: |
          apt-get update
          apt-get install -y git nodejs jq gettext-base curl ca-certificates
      - uses: actions/checkout@v4
      - name: run twice, second must not change anything
        run: |
          set -euo pipefail
          export HOME=/tmp/fakehome
          mkdir -p "$HOME"
          cp -r "$GITHUB_WORKSPACE" "$HOME/dotfiles"
          cd "$HOME/dotfiles"

          ./install.sh --yes >/tmp/first.log 2>&1
          find "$HOME" -path "$HOME/dotfiles" -prune -o -print | sort >/tmp/first.state

          ./install.sh --yes >/tmp/second.log 2>&1
          find "$HOME" -path "$HOME/dotfiles" -prune -o -print | sort >/tmp/second.state

          if ! diff -u /tmp/first.state /tmp/second.state; then
            echo "second run changed the filesystem: install.sh is not idempotent"
            exit 1
          fi
          grep -c 'already current' /tmp/second.log
