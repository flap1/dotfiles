# Origin is GitLab. GitHub Actions in .github/workflows/ci.yml is for forks.
# Both call scripts/ci-shell.sh and scripts/ci-install.sh.

stages:
  - check

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

secrets:
  stage: check
  image: zricethezav/gitleaks:v8.21.2
  entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks detect --source . --verbose --redact

shell:
  stage: check
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - apt-get install -y git shellcheck zsh python3 curl ca-certificates
    - curl -sSLo /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.11.0/shfmt_v3.11.0_linux_amd64
    - chmod +x /usr/local/bin/shfmt
  script:
    - bash scripts/ci-shell.sh

install:
  stage: check
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - apt-get install -y git nodejs jq gettext-base curl ca-certificates
  script:
    - bash scripts/ci-install.sh

pwsh:
  stage: check
  image: mcr.microsoft.com/powershell:7.4-ubuntu-24.04
  before_script:
    - apt-get update
    - apt-get install -y git
  script:
    - pwsh -NoProfile -File scripts/ci-pwsh.ps1
