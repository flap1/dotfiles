# Codex settings that belong to me rather than to the CLI.
#
# ~/.codex/config.toml is a shared file: Codex writes [projects.*] trust
# levels, [notice.model_migrations], [tui.model_availability_nux] and
# [marketplaces.*] timestamps into it as you work. Symlinking the whole file
# would push that churn -- and the absolute paths in [projects.*] -- into every
# machine that reads this repository.
#
# Codex can layer config (`codex -p <name>` reads
# $CODEX_HOME/<name>.config.toml on top of the base), but it is flag-only:
# putting `profile = "..."` in config.toml makes `codex doctor` report "failed
# to load Codex config" on 0.147.0, and the flag is rejected outside runtime
# subcommands. So the layering happens at install time instead, in
# compose_codex_settings(), which splices the sections below into the live file
# and leaves every other section untouched.
#
# Do not put scalar keys under [agents] (default_subagent_model and friends).
# 0.147's TUI reloads [agents] through toml::Value + serde flatten, so a string
# there is parsed as a role and thread/start dies with AgentRoleToml. Pin
# Terra on the built-in roles via [agents.<name>] tables + agents/*.toml
# instead. compose_codex_settings() rewrites those config_file paths to
# absolute, because 0.147 also rejects a relative AgentRoleToml.config_file.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
approvals_reviewer = "auto_review"
# [features.multi_agent_v2] is still flagged unstable; we keep it for the
# thread cap, so silence the startup banner rather than drop the feature.
suppress_unstable_features_warning = true

[agents]

[agents.default]
description = "Default agent."
config_file = "agents/default.toml"

[agents.explorer]
description = """
Use `explorer` for specific codebase questions.
Explorers are fast and authoritative.
They must be used to ask specific, well-scoped questions on the codebase.
Rules:
- In order to avoid redundant work, you should avoid exploring the same problem that explorers have already covered. Typically, you should trust the explorer results without additional verification. You are still allowed to inspect the code yourself to gain the needed context!
- You are encouraged to spawn up multiple explorers in parallel when you have multiple distinct questions to ask about the codebase that can be answered independently. This allows you to get more information faster without waiting for one question to finish before asking the next. While waiting for the explorer results, you can continue working on other local tasks that do not depend on those results. This parallelism is a key advantage of delegation, so use it whenever you have multiple questions to ask.
- Reuse existing explorers for related questions.
"""
config_file = "agents/explorer.toml"

[agents.worker]
description = """
Use for execution and production work.
Typical tasks:
- Implement part of a feature
- Fix tests or bugs
- Split large refactors into independent chunks
Rules:
- Explicitly assign **ownership** of the task (files / responsibility). When the subtask involves code changes, you should clearly specify which files or modules the worker is responsible for. This helps avoid merge conflicts and ensures accountability. For example, you can say "Worker 1 is responsible for updating the authentication module, while Worker 2 will handle the database layer." By defining clear ownership, you can delegate more effectively and reduce coordination overhead.
- Always tell workers they are **not alone in the codebase**, and they should not revert the edits made by others, and they should adjust their implementation to accommodate the changes made by others. This is important because there may be multiple workers making changes in parallel, and they need to be aware of each other's work to avoid conflicts and ensure a cohesive final product.
"""
config_file = "agents/worker.toml"

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 20

[mcp_servers.code-review-graph]
command = "uvx"
args = ["code-review-graph", "serve"]
type = "stdio"

[mcp_servers.code-review-graph.tools.build_or_update_graph_tool]
approval_mode = "approve"

# Own [tui] for the status line only. Codex writes [tui.model_availability_nux]
# separately, and compose keeps that block. Setting status_line replaces the
# default (model-with-reasoning, current-dir), so those stay in the list.
[tui]
status_line = ["model-with-reasoning", "current-dir", "weekly-limit"]
