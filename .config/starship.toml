add_newline = true

format = "$directory$git_branch$git_status$cmd_duration\n$character"
right_format = "$username$hostname"

[username]
show_always = false
format = "[$user]($style)"
style_user = "bold yellow"

[hostname]
ssh_only = true
format = "@[$hostname]($style)"
style = "bold dimmed green"
trim_at = "."

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
truncation_length = 5
truncate_to_repo = false

[git_branch]
format = "[$branch]($style) "
style = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
stashed = "$${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
