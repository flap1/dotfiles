#:schema https://yazi-rs.github.io/schemas/theme.json
# Same palette as nvim and tmux. Colour is role; icons are type.

[app]
overall = { bg = "#0f172a" }

[mgr]
cwd = { fg = "#10b981", bold = true }
find_keyword  = { fg = "#0f172a", bg = "#f59e0b", bold = true }
find_position = { fg = "#f59e0b" }
symlink_target = { fg = "#64748b", italic = true }
marker_copied   = { fg = "#059669", bg = "#059669" }
marker_cut      = { fg = "#ef4444", bg = "#ef4444" }
marker_marked   = { fg = "#0ea5e9", bg = "#0ea5e9" }
marker_selected = { fg = "#f59e0b", bg = "#f59e0b" }
count_copied   = { fg = "#ffffff", bg = "#059669" }
count_cut      = { fg = "#ffffff", bg = "#ef4444" }
count_selected = { fg = "#0f172a", bg = "#f59e0b" }
border_style = { fg = "#64748b" }

[tabs]
active   = { fg = "#047857", bg = "#ffffff", bold = true }
inactive = { fg = "#a7f3d0", bg = "#047857" }

[mode]
normal_main = { fg = "#ffffff", bg = "#047857", bold = true }
normal_alt  = { fg = "#047857", bg = "#1e293b" }
select_main = { fg = "#0f172a", bg = "#f59e0b", bold = true }
select_alt  = { fg = "#f59e0b", bg = "#1e293b" }
unset_main = { fg = "#ffffff", bg = "#ef4444", bold = true }
unset_alt  = { fg = "#ef4444", bg = "#1e293b" }

[indicator]
current = { fg = "#ffffff", bg = "#047857", bold = true }
parent  = { fg = "#e2e8f0", bg = "#334155" }
preview = { underline = true }

[status]
overall = { fg = "#e2e8f0", bg = "#1e293b" }
perm_sep   = { fg = "#64748b" }
perm_type  = { fg = "#94a3b8" }
perm_read  = { fg = "#fbbf24" }
perm_write = { fg = "#ef4444" }
perm_exec  = { fg = "#10b981" }
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#10b981", bg = "#334155" }
progress_error  = { fg = "#0f172a", bg = "#ef4444" }

[which]
mask            = { bg = "#0f172a" }
cand            = { fg = "#10b981" }
rest            = { fg = "#64748b" }
desc            = { fg = "#e2e8f0" }
separator_style = { fg = "#334155" }

[confirm]
border  = { fg = "#059669" }
title   = { fg = "#10b981" }
body    = { fg = "#e2e8f0" }
list    = { fg = "#94a3b8" }
btn_yes = { fg = "#ffffff", bg = "#059669", bold = true }
btn_no  = { fg = "#94a3b8" }

[input]
border   = { fg = "#059669" }
title    = { fg = "#e2e8f0" }
value    = { fg = "#e2e8f0" }
selected = { fg = "#e2e8f0", bg = "#334155" }

[pick]
border   = { fg = "#059669" }
active   = { fg = "#10b981", bold = true }
inactive = { fg = "#94a3b8" }

[cmp]
border   = { fg = "#059669" }
active   = { fg = "#e2e8f0", bg = "#334155" }
inactive = { fg = "#94a3b8" }

[tasks]
border  = { fg = "#059669" }
title   = { fg = "#e2e8f0" }
hovered = { fg = "#10b981", bold = true }

[spot]
border   = { fg = "#059669" }
title    = { fg = "#10b981" }
tbl_col  = { fg = "#10b981" }
tbl_cell = { fg = "#0f172a", bg = "#f59e0b" }

[help]
on      = { fg = "#10b981" }
run     = { fg = "#0ea5e9" }
desc    = { fg = "#94a3b8" }
hovered = { fg = "#e2e8f0", bg = "#334155", bold = true }
footer  = { fg = "#ffffff", bg = "#047857" }

[notify]
title_info  = { fg = "#059669" }
title_warn  = { fg = "#f59e0b" }
title_error = { fg = "#ef4444" }

[filetype]
rules = [
	{ mime = "vfs/{absent,stale}", fg = "#64748b" },
	{ url = "*", is = "orphan", fg = "#ef4444" },
	{ url = "*", is = "exec", fg = "#a7f3d0" },
	{ url = "*", is = "dummy", fg = "#0f172a", bg = "#ef4444" },
	{ url = "*/", is = "dummy", fg = "#0f172a", bg = "#ef4444" },
	{ url = "*/", fg = "#10b981" },
	{ url = "*", fg = "#e2e8f0" },
]

[icon]
dirs = []
conds = [
	{ if = "orphan", text = "", fg = "#ffffff" },
	{ if = "link", text = "", fg = "#9e9e9e" },
	{ if = "block", text = "", fg = "#cddc39" },
	{ if = "char", text = "", fg = "#cddc39" },
	{ if = "fifo", text = "", fg = "#cddc39" },
	{ if = "sock", text = "", fg = "#cddc39" },
	{ if = "sticky", text = "", fg = "#cddc39" },
	{ if = "dummy", text = "", fg = "#f44336" },
	{ if = "dir & hovered", text = "" },
	{ if = "dir", text = "" },
	{ if = "exec", text = "", fg = "#8bc34a" },
	{ if = "!dir", text = "" },
]
