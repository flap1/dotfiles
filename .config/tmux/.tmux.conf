# -- plugins -------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux'
set -g @continuum-restore 'on'

# -- general -------------------------------------------------------------------
# True Color
# set -g default-terminal 'xterm-256color'
set-option -g default-terminal "tmux-256color"
set -ag terminal-overrides ',alacritty:RGB'

setw -g xterm-keys on
set -s escape-time 0                     # faster command sequences
set -sg repeat-time 300                   # increase repeat timeout
set -s focus-events on

set -g prefix C-\\ # change prefix key to C-\
unbind C-b # unbind

set -q -g status-utf8 on                  # expect UTF-8 (tmux < 2.2)
setw -q -g utf8 on

set -g history-limit 5000                 # boost history

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# -- display -------------------------------------------------------------------
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status on
set -g status-interval 5

# -- catppuccin theme ----------------------------------------------------------
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " #(TZ=Asia/Tokyo date +'%%m/%%d %%H:%%M JST')"

run ~/.tmux/plugins/tmux/catppuccin.tmux
run ~/.tmux/plugins/tmux-cpu/cpu.tmux
# ram after plugins loaded
set -ag status-right " #[fg=colour2] 󰘚 #(free -g | awk '/Mem/{printf \"%.1fGB\", $3}')#[default]"

set -g pane-border-status top
set -g pane-border-format "#{window_name}"


# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off

# -- navigation ----------------------------------------------------------------
# create session
bind C-c new-session
bind c new-session

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# session navigation
bind BTab switch-client -l  # move to last session

# split current window horizontally
bind - split-window -v
# split current window vertically
bind | split-window -h

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# maximize current pane
bind + resize-pane -Z

# pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -- window navigation -------------------------------------------------------
unbind n
unbind p

bind C-h previous-window # select previous window
bind C-l next-window     # select next window
bind Tab last-window        # move to last active window

bind C-q confirm-before -p "kill-window #W? (y/n)" kill-window
bind C-n new-window        # move to last active window
bind q confirm-before -p "kill-window #W? (y/n)" kill-window
bind n new-window        # move to last active window

bind -r w choose-tree -w
bind -r C-w choose-tree -w
# bind -r s choose-tree -s
# bind -r C-s choose-tree -s

bind -r t clock-mode
bind -r C-t clock-mode

# mouse: on by default, toggle with prefix+m
set -g mouse on
bind m run "cut -c3- ~/.tmux.conf | sh -s _toggle_mouse"

# Kill windows and panes faster, by rebinding the confirmation key
# bind-key C-d confirm-before -p "kill-window #W? (y/n)" kill-window
# bind-key C-w kill-pane

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
