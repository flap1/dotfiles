# -- plugins -------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Fork: upstream dump_panes collapses empty pane_title tabs (PR #564),
# the ps strategy greps by prefix, and this adds foreground_pgroup.
set -g @plugin 'flap1/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'
# ~ matches anywhere in the absolute cmdline. Conversation UIs are the
# rewritten resume form; a bare ~claude also matches claude-ls.
set -g @resurrect-processes '"~claude --resume" "~agent --resume" "~codex resume" "~codex exec resume" "~lazygit" "~btop" "~htop"'
# Default ps lists every child (MCP servers) and misses a pane with no shell.
set -g @resurrect-save-command-strategy 'foreground_pgroup'
# Rewrites conversation panes to name that conversation. See test-resume.sh.
set -g @resurrect-hook-post-save-layout '~/bin/tmux-session-resume'

# -- general -------------------------------------------------------------------
set-option -g default-terminal "tmux-256color"
set -ag terminal-overrides ',xterm-256color:RGB'
set -g allow-passthrough on
set -g set-clipboard on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# tmux-sensible only zeroes escape-time when it still reads the old default of 500.
# tmux 3.7 ships 10, so without this line nothing sets it.
set -s escape-time 0
set -sg repeat-time 1000

set -g prefix C-Space
unbind C-b

set -g history-limit 50000

bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# -- display -------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g display-time 1000
# Killing a session would otherwise drop the terminal back to the shell.
set -g detach-on-destroy off

# -- catppuccin ----------------------------------------------------------------
set -g @catppuccin_flavor 'mocha'
run ~/.tmux/plugins/tmux/catppuccin.tmux

# -- status bar ----------------------------------------------------------------
# #047857 rather than #059669: white on #059669 is ~3.7:1, under the 4.5:1 floor.
# Continuum prepends its save hook to status-right on load, so this must not
# be re-set after tpm. The clock is a shell call because the host is Etc/UTC.
set -g status-left-length 40
set -g status-right-length 90
set -g status-justify left
set -g status-left "#[fg=#a7f3d0,bold] #S   #[default]"
set -g status-right "#{?client_prefix,#[bg=#f59e0b#,fg=#0f172a#,bold] ● #[default] ,}#[fg=#a7f3d0]#{s|^#{HOME}|~|:session_path}#[default]  #(~/.tmux-status.sh)  #(TZ=Asia/Tokyo date +'%%H:%%M') "

# -- pane borders --------------------------------------------------------------
set -g pane-border-status top
set -g pane-border-format " #{?pane_in_mode,#{pane_mode},#{?@pane_label,#{@pane_label},#{pane_current_command}}} "
set -g monitor-activity on

# -- navigation ----------------------------------------------------------------
bind c new-session
# attach-session is the only command that sets session_path; from a shell it
# refuses (nested-session guard). Overrides stock prefix+. (move-window).
bind . attach-session -c "#{pane_current_path}" \; display 'session dir: #{pane_current_path}'
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l

# Alt is the pane layer (move, jump, resize). M-| not M-+: '+' is US-layout
# adjacency to '-', which JIS does not have.
bind -n M-- split-window -v
bind -n M-| split-window -h

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8
bind -n M-9 select-pane -t 9

# User option, not pane_title: OSC 2 from apps would clobber it. Empty falls back.
bind t command-prompt -p "pane label:" -I "#{@pane_label}" { set -p @pane_label "%%" }

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-H resize-pane -L 3
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 3

# -- windows -------------------------------------------------------------------
unbind n
unbind p
bind C-h previous-window
bind C-l next-window
bind Tab last-window
bind C-q confirm-before -p "kill-window #W? (y/n)" kill-window
bind n new-window
bind q display-panes -d 0
# Stock w is already choose-tree -Zw. -w keeps pane rows out until +, so digits
# have no gaps. A filter that hides panes also drops single-pane windows.

bind a display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "$HOME/bin/claude-ls"
bind A display-popup -E -w 90% -h 85% "claude agents"
# -d: gh-dash scopes to the pane's repo. A persistent session would freeze the first.
bind p display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "gh dash"

bind T clock-mode
set -g mouse on
bind m set -g mouse \; display "mouse: #{?mouse,on,off}"

# -- copy mode -----------------------------------------------------------------
# tmux vi is not vim: Space starts a selection, v is rectangle-toggle, y unbound.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# Alternate-screen apps have no scrollback. Dump the screen and yank in nvim.
bind y run-shell 'f=$(mktemp "${TMPDIR:-/tmp}/tmux-capture.XXXXXX"); tmux capture-pane -pJ -S - -t "#{pane_id}" > "$f"; tmux display-popup -E -w 90% -h 90% "nvim -c \"\\$\" -- $f"; rm -f "$f"'

run '~/.tmux/plugins/tpm/tpm'

# After tpm: sensible duplicates R / C-n / C-p. Prefix Space is next to C-Space.
unbind R
unbind C-n
unbind C-p
unbind Space

# After tpm: catppuccin sets these last.
set -g pane-border-style "fg=#64748b"
set -g pane-active-border-style "#{?pane_in_mode,fg=#f59e0b#,bold,fg=#059669#,bold}"
set -g pane-border-lines heavy

set -g status-style "bg=#047857,fg=#ffffff"
set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_zoomed_flag, +,} "
set -g window-status-current-format "#[bg=#ffffff,fg=#047857,bold] #I #W#{?window_zoomed_flag, +,} #[default]"
set -g window-status-activity-style "underscore"
set -g window-status-bell-style "bg=#f59e0b,fg=#0f172a,bold"

set -g mode-style "bg=#059669,fg=#ffffff"
set -g message-style "bg=#0f172a,fg=#f59e0b"
set -g message-command-style "bg=#0f172a,fg=#94a3b8"
set -g copy-mode-match-style "bg=#334155,fg=#e2e8f0"
set -g copy-mode-current-match-style "bg=#f59e0b,fg=#0f172a"
set -g display-panes-colour "#64748b"
set -g display-panes-active-colour "#059669"
set -g clock-mode-colour "#059669"
