# -- plugins -------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# resurrect is a fork. Upstream stopped merging in 2023-03 (67 open PRs, the
# oldest from 2014), and these have to be fixed there or repaired downstream
# forever:
#   - an empty pane_title shifts the fields of the save file. dump_panes reads
#     its own output with IFS=$'\t', but tab is IFS whitespace, so a run of
#     tabs collapses to one and pane_active lands in dir. restore reads the
#     same way, so an untitled pane comes back in the wrong directory with no
#     command (PR #564)
#   - the ps strategy greps by prefix, so pane_pid 2255 also matches ppid 22551
#   - adds the foreground_pgroup strategy (@resurrect-save-command-strategy
#     below)
set -g @plugin 'flap1/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
# Full recovery from a power cut: the server starts at boot, continuum
# restores the last save.
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'          # writes and enables systemd --user tmux.service
set -g @continuum-save-interval '5'  # at most five minutes lost to a power cut
set -g @resurrect-capture-pane-contents 'on'
# A whitelist: only what is listed here comes back.
# A leading ~ means "matches anywhere in the full path". Without it an absolute
# cmdline like /usr/bin/lazygit does not match and is silently not restored.
# ( |$) is needed because a bare ~claude also matches bin/claude-ls, which
# would turn a claude-ls pane into claude itself. After the ~, bash regex
# applies as written.
# No -> forms: what is saved is the complete command line with its absolute
# path, which runs as it stands.
set -g @resurrect-processes '"~claude( |$)" "~lazygit" "~btop" "~htop"'
# What runs in a pane is the tty's foreground process group. The default ps
# strategy lists every child of the pane, so a shell holding a background MCP
# server restores an unrelated child; and a pane started without a shell
# (pane_pid is the program) has no children and saves nothing. Both happen
# routinely on this box.
set -g @resurrect-save-command-strategy 'foreground_pgroup'
# What is saved is the cmdline, so a bare `claude` restores into a new
# conversation. This hook rewrites the state file just after the save into
# `claude --resume <sessionId>`. Nothing needs to wrap the launch.
# Regression check: .config/tmux/test-resume.sh
set -g @resurrect-hook-post-save-layout '~/bin/tmux-claude-resume'

# -- general -------------------------------------------------------------------
# True Color
set-option -g default-terminal "tmux-256color"
set -ag terminal-overrides ',xterm-256color:RGB' # Windows Terminal over ssh
set -g allow-passthrough on
# the default, external, drops OSC52 from the app (nvim); on receives it and passes it outward
set -g set-clipboard on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Load-bearing despite looking redundant: tmux-sensible only zeroes escape-time
# when it still reads the OLD default of 500, and tmux 3.7 ships 10, so without
# this line nothing sets it. default-terminal below is the same shape.
set -s escape-time 0
set -sg repeat-time 1000                  # 300 was too short to chain prefix+HJKL

set -g prefix C-Space
unbind C-b

set -g history-limit 50000                # matches what tmux-sensible would set

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# -- display -------------------------------------------------------------------
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-time 1000      # slightly longer status messages display time

# Killing a session -- or the last window in one, which destroys it -- would
# otherwise detach the client and drop the whole terminal back to the shell.
# off switches to the most recently used surviving session instead, and only
# actually detaches when nothing is left.
set -g detach-on-destroy off


# -- catppuccin theme ----------------------------------------------------------
set -g @catppuccin_flavor 'mocha'

run ~/.tmux/plugins/tmux/catppuccin.tmux

# -- status bar ----------------------------------------------------------------
# The whole bar is the primary surface with on-primary text, which is what the
# palette describes that pair for. #047857 rather than #059669 because white on
# #059669 is only ~3.7:1, under the 4.5:1 floor for body text; #047857 is 5.3:1.
# One filled green, and the only thing that breaks it is the current window as
# an inverted white chip. Everything else separates by weight or by a rule.
# Left is identity, centre is navigation, right is state. CPU% and RAM used to
# live on the right: four forks every status-interval for numbers nobody acts
# on, and two of them emitted format strings that #() never re-expands. free -g
# also counts cache as used, so it read 120GB on an idle box.
#
# The clock is the only shell call left, because the host runs Etc/UTC and
# tmux's own strftime follows the server timezone. tmux-continuum prepends its
# save hook to status-right on load, so this must not be re-set after tpm.
set -g status-left-length 40
set -g status-right-length 90
set -g status-justify left
# The session is a label for the row, not another item in it, so it recedes:
# #a7f3d0 reads at 4.1:1 against the bar while the windows sit at white's
# 5.3:1. A colon was tried here and did not work; session:window addresses one
# window, but a whole list follows, so the colon only ever bound to the first.
set -g status-left "#[fg=#a7f3d0,bold] #S   #[default]"
# session_path is the directory new windows inherit, and it is invisible
# otherwise: attach-session -c changes it silently. It sits on the right with
# the rest of the state, and $HOME collapses to ~ because the prefix is the
# same on every line and carries nothing.
set -g status-right "#{?client_prefix,#[bg=#f59e0b#,fg=#0f172a#,bold] ● #[default] ,}#[fg=#a7f3d0]#{s|^#{HOME}|~|:session_path}#[default]  #(~/.tmux-status.sh)  #(TZ=Asia/Tokyo date +'%%H:%%M') "

# -- pane borders --------------------------------------------------------------
set -g pane-border-status top

# The old format printed window_name on every border, which is the same
# string on all of them. Show the pane's own label instead, falling back to
# the running command. @pane_label is set by prefix+t below.
# While a pane is in a mode the border says which mode, replacing the label:
# that is the one time the label is not the thing you need to know.
set -g pane-border-format " #{?pane_in_mode,#{pane_mode},#{?@pane_label,#{@pane_label},#{pane_current_command}}} "


# activity
set -g monitor-activity on

# -- navigation ----------------------------------------------------------------
# create session
bind c new-session

# pin this session's default directory to where the current pane is, so new
# windows start there. attach-session is the only command that sets it, and it
# refuses to run from a shell inside tmux (nested-session guard) -- from a key
# binding the server runs it directly, so this is the way to do it.
#
# On '.' because that is what the directory is called, and because the previous
# home, prefix+C, sat one shift away from prefix+c = new-session: two different
# session-scoped actions on the same letter, told apart only by the shift key.
# Overrides stock prefix+. (move-window, a numeric prompt this config has no
# use for).
bind . attach-session -c "#{pane_current_path}" \; display 'session dir: #{pane_current_path}'

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# session navigation
bind BTab switch-client -l  # move to last session

# split current window. Prefix-less, because Alt is the pane layer everywhere
# else in this file -- move (M-hjkl), jump (M-1..9), resize (M-HJKL) -- and
# split was the one exception left on prefix. An exception has to be
# remembered individually; a rule can be derived, which matters most for the
# keys pressed least. The symbols are the ones the prefix bindings used, so
# there is nothing to relearn, and stock prefix+" / prefix+% are still bound
# as a fallback.
#
# Safe in the root table on two counts: escape-time 0 delivers a lone Esc
# immediately, so Esc-then-'-' in nvim is never collapsed into M-- (the same
# reason M-hjkl already coexists with Esc-then-j); and zsh here runs viins,
# whose keymap binds neither ^[- nor ^[|, so nothing is taken away from the
# shell. Not M-+ : '+' means "vertical" only by way of US-layout adjacency to
# '-', which JIS does not have, while '|' is the divider it draws.
bind -n M-- split-window -v
bind -n M-| split-window -h

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right

# prefix-less pane navigation (Alt+hjkl is unbound in Windows Terminal)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# prefix-less jump to pane by number; matches the stock prefix+0-9 for windows.
# Indices are 1-based to line up with pane-base-index and the prefix+q overlay.
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8
bind -n M-9 select-pane -t 9

# swap-pane is on the stock { and }; zoom is on the stock z.

# Rename a pane. Uses a user option rather than select-pane -T because
# programs (Claude Code, ssh, starship) overwrite pane_title via OSC 2 and
# would clobber it. Submit an empty string to fall back to the command name.
# Window rename is the stock prefix+, and needs nothing here.
# t, not T: , and t keep the rename family unshifted. t used to be clock-mode,
# which is dead weight when the status bar already carries the time.
bind t command-prompt -p "pane label:" -I "#{@pane_label}" { set -p @pane_label "%%" }

# pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# prefix-less resize. Alt+Shift+hjkl is free in Windows Terminal (it binds
# Alt+Shift+arrow, not the letters). Hold it down instead of re-pressing prefix.
bind -n M-H resize-pane -L 3
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 3

# -- window navigation -------------------------------------------------------
unbind n
unbind p

bind C-h previous-window # select previous window
bind C-l next-window     # select next window
bind Tab last-window        # move to last active window

# kill-window: kept on C-q as well as the stock & (& needs shift on a JIS layout)
bind C-q confirm-before -p "kill-window #W? (y/n)" kill-window
bind n new-window

# q shows pane numbers; press 0-9 to jump. -d 0 keeps them up until a keypress.
# kill-window still lives on C-q and on the stock & binding.
bind q display-panes -d 0

# choose-tree is deliberately not rebound: stock w is already `choose-tree -Zw`,
# and -w is what you want. The shortcut digits come from #{line}, the row's index
# in the list, so every pane row on screen costs a digit -- show the pane level by
# default and they come out 0, 1, 4, 7. -w starts windows collapsed, which keeps
# pane rows out of the list until you press + on one, so the digits run 0..9 then
# M-a..M-z with no gaps. Panes are one + away and prefix q numbers them anyway.
#
# Not worth retrying: -f to hide panes deletes the windows too, because the filter
# runs per pane and window_tree_build_window drops a single-pane window whose only
# pane was filtered out. And nothing in -K can renumber around pane rows, since
# there is no format for "index among non-pane rows" -- #{window_index} is the
# closest and it collides across sessions, where the first row in tree order wins.

# Claude sessions in a popup rather than a window: something to glance at and
# dismiss, with the current pane still underneath.
#
# a and A are two different lists. `claude agents` shows only *background*
# sessions, so with none dispatched it is legitimately empty -- the interactive
# sessions you actually have open are invisible there. claude-list.sh reads
# `claude agents --json`, the one listing that includes kind=interactive, and
# jumps to the owning pane where it can find one. It lives in bin/ because it is
# a useful command on its own: `claude-ls`, or `claude-ls --print` under watch.
#
# Which client the picker's enter moves is worked out inside claude-ls, from
# $TMUX -- display-popup expands no format in -e or in the command, so the
# client cannot be handed in from here.
bind a display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "$HOME/bin/claude-ls"
bind A display-popup -E -w 90% -h 85% "claude agents"

# Same idea for PRs. -d matters: gh-dash scopes its sections to the repo of the
# cwd it starts in, so the popup inherits the pane's repo and the dashboard is
# already filtered. That is also why this is not a persistent session -- one
# would be stuck on whichever repo it was first opened from.
bind p display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "gh dash"

# The list is deliberately not parked in a pane of every new window: it is a
# picker, one per window renders the same machine-wide state N times, and 62
# columns of something always on screen stops being read. What that pane was
# actually for -- noticing a session that wants an answer -- is on the status
# bar instead (ASK/WAIT in status.sh), and choosing one is prefix+a above.

bind T clock-mode

# mouse: on by default, toggle with prefix+m
set -g mouse on
bind m set -g mouse \; display "mouse: #{?mouse,on,off}"

# -- copy mode -----------------------------------------------------------------
# mode-keys is already vi (tmux infers it from $EDITOR=nvim), but tmux's vi
# table is not vim's: selection starts on Space, v is rectangle-toggle, and y
# is unbound. Three keys make it read like vim; nothing else here changes.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Claude Code (and btop, lazygit, ...) run in the alternate screen, so the pane
# has no scrollback for copy-mode to walk and the app eats mouse drags. What is
# on screen is still capturable: dump it and yank in nvim, where the motions are
# the real ones and vim.g.clipboard's OSC 52 provider reaches Windows.
# -J unwraps, so a wrapped path or command comes out as one line.
bind y run-shell 'tmux capture-pane -pJ -S - -t "#{pane_id}" > /tmp/tmux-capture.txt' \; \
  display-popup -E -w 90% -h 90% 'nvim +$ /tmp/tmux-capture.txt'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# tmux-sensible adds duplicates of keys this file already defines:
# R (r reloads), C-n/C-p (C-l/C-h switch windows). Must come after tpm.
unbind R
unbind C-n
unbind C-p

# prefix is C-Space, so prefix Space is one keystroke away from the prefix
# itself and reaching it by accident relayouts every pane.
unbind Space

# -- pane border colours -------------------------------------------------------
# Must come after tpm: catppuccin sets these too and tpm reloads it last.
# Design tokens on the dark mocha base (#1e1e2e):
#   inactive = text/subtle  #64748b  (~4.5:1)
#   active   = success      #059669  (~4.4:1)
# primary/green #047857 is the brand colour but only reaches ~3.0:1 here,
# right on the WCAG non-text floor. #059669 is the same hue one step up,
# which is how that green should read on a dark background.
set -g pane-border-style "fg=#64748b"
# Amber while in copy/view/tree mode. The border is already where you are
# looking, so it carries the mode instead of the status bar, which would
# make you glance away to learn something about the pane in front of you.
set -g pane-active-border-style "#{?pane_in_mode,fg=#f59e0b#,bold,fg=#059669#,bold}"

# Borders are always one cell wide; heavy swaps in the thicker UTF-8 box
# glyphs, which falls back to ACS line drawing without UTF-8.
set -g pane-border-lines heavy

# catppuccin renders the window tabs with #T (pane title), so the tab showed
# whatever the running program set via OSC 2 and the window name appeared
# nowhere at all. #W is the window name. Dropping the powerline separators
# also drops the glyph-font dependency; weight and colour carry the active
# state instead, which survives any font.
set -g status-style "bg=#047857,fg=#ffffff"
set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_zoomed_flag, +,} "
set -g window-status-current-format "#[bg=#ffffff,fg=#047857,bold] #I #W#{?window_zoomed_flag, +,} #[default]"
# Activity was amber on the green field: ~2.6:1, and it read as a third state
# rather than a nudge. Underline says "something happened here" without
# introducing a hue that competes with the white current-window chip.
set -g window-status-activity-style "underscore"
set -g window-status-bell-style "bg=#f59e0b,fg=#0f172a,bold"

# -- modes and messages --------------------------------------------------------
# One family throughout: slate for structure, emerald for "this one", amber for
# "look here". No second cue where the colour already says it.
set -g mode-style "bg=#059669,fg=#ffffff"
set -g message-style "bg=#0f172a,fg=#f59e0b"
set -g message-command-style "bg=#0f172a,fg=#94a3b8"
set -g copy-mode-match-style "bg=#334155,fg=#e2e8f0"
set -g copy-mode-current-match-style "bg=#f59e0b,fg=#0f172a"
set -g display-panes-colour "#64748b"
set -g display-panes-active-colour "#059669"
set -g clock-mode-colour "#059669"
