# -- plugins -------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @continuum-restore 'on'

# -- general -------------------------------------------------------------------
# True Color
set-option -g default-terminal "tmux-256color"
set -ag terminal-overrides ',xterm-256color:RGB' # Windows Terminal over ssh
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Load-bearing despite looking redundant: tmux-sensible only zeroes escape-time
# when it still reads the OLD default of 500, and tmux 3.7 ships 10, so without
# this line nothing sets it. default-terminal below is the same shape.
set -s escape-time 0
set -sg repeat-time 1000                  # 300 was too short to chain prefix+HJKL

set -g prefix C-Space
unbind C-b

set -g history-limit 50000                # matches what tmux-sensible would set

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# -- display -------------------------------------------------------------------
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-time 1000      # slightly longer status messages display time


# -- catppuccin theme ----------------------------------------------------------
set -g @catppuccin_flavor 'mocha'

run ~/.tmux/plugins/tmux/catppuccin.tmux

# -- status bar ----------------------------------------------------------------
# The whole bar is the primary surface with on-primary text, which is what the
# palette describes that pair for. #047857 rather than #059669 because white on
# #059669 is only ~3.7:1, under the 4.5:1 floor for body text; #047857 is 5.3:1.
# One filled green, and the only thing that breaks it is the current window as
# an inverted white chip. Everything else separates by weight or by a rule.
# Left is identity, centre is navigation, right is state. CPU% and RAM used to
# live on the right: four forks every status-interval for numbers nobody acts
# on, and two of them emitted format strings that #() never re-expands. free -g
# also counts cache as used, so it read 120GB on an idle box.
#
# The clock is the only shell call left, because the host runs Etc/UTC and
# tmux's own strftime follows the server timezone. tmux-continuum prepends its
# save hook to status-right on load, so this must not be re-set after tpm.
set -g status-left-length 40
set -g status-right-length 60
set -g status-justify left
# session:window is tmux's own target syntax, so the colon separates the two
# zones and states their relationship at the same time. No rule, no second
# fill: #065f46 beside #047857 was two dark greens muddying each other.
set -g status-left "#[bold] #S#[nobold]:#[default]"
set -g status-right "#{?client_prefix,#[bg=#f59e0b#,fg=#0f172a#,bold] ● #[default] ,}#(~/.tmux-status.sh)  #(TZ=Asia/Tokyo date +'%%H:%%M') "

# -- pane borders --------------------------------------------------------------
set -g pane-border-status top

# The old format printed window_name on every border, which is the same
# string on all of them. Show the pane's own label instead, falling back to
# the running command. @pane_label is set by prefix+T below.
set -g pane-border-format " #{?@pane_label,#{@pane_label},#{pane_current_command}} "


# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# activity
set -g monitor-activity on

# -- navigation ----------------------------------------------------------------
# create session
bind c new-session

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# session navigation
bind BTab switch-client -l  # move to last session

# split current window horizontally
bind - split-window -v
# split current window vertically
bind | split-window -h

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right

# prefix-less pane navigation (Alt+hjkl is unbound in Windows Terminal)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# prefix-less jump to pane by number; matches the stock prefix+0-9 for windows.
# Indices are 1-based to line up with pane-base-index and the prefix+q overlay.
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8
bind -n M-9 select-pane -t 9

# swap-pane is on the stock { and }; zoom is on the stock z.

# Rename a pane. Uses a user option rather than select-pane -T because
# programs (Claude Code, ssh, starship) overwrite pane_title via OSC 2 and
# would clobber it. Submit an empty string to fall back to the command name.
# Window rename is the stock prefix+, and needs nothing here.
# t, not T: , and t keep the rename family unshifted. t used to be clock-mode,
# which is dead weight when the status bar already carries the time.
bind t command-prompt -p "pane label:" -I "#{@pane_label}" { set -p @pane_label "%%" }

# pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# prefix-less resize. Alt+Shift+hjkl is free in Windows Terminal (it binds
# Alt+Shift+arrow, not the letters). Hold it down instead of re-pressing prefix.
bind -n M-H resize-pane -L 3
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 3

# -- window navigation -------------------------------------------------------
unbind n
unbind p

bind C-h previous-window # select previous window
bind C-l next-window     # select next window
bind Tab last-window        # move to last active window

# kill-window: kept on C-q as well as the stock & (& needs shift on a JIS layout)
bind C-q confirm-before -p "kill-window #W? (y/n)" kill-window
bind n new-window

# q shows pane numbers; press 0-9 to jump. -d 0 keeps them up until a keypress.
# kill-window still lives on C-q and on the stock & binding.
bind q display-panes -d 0

# choose-tree is stock on both s (sessions) and w (windows), and the stock
# bindings pass -Z. The override here was the same key doing strictly less.
bind T clock-mode

# mouse: on by default, toggle with prefix+m
set -g mouse on
bind m set -g mouse \; display "mouse: #{?mouse,on,off}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# tmux-sensible adds duplicates of keys this file already defines:
# R (r reloads), C-n/C-p (C-l/C-h switch windows). Must come after tpm.
unbind R
unbind C-n
unbind C-p

# -- pane border colours -------------------------------------------------------
# Must come after tpm: catppuccin sets these too and tpm reloads it last.
# Design tokens on the dark mocha base (#1e1e2e):
#   inactive = text/subtle  #64748b  (~4.5:1)
#   active   = success      #059669  (~4.4:1)
# primary/green #047857 is the brand colour but only reaches ~3.0:1 here,
# right on the WCAG non-text floor. #059669 is the same hue one step up,
# which is how that green should read on a dark background.
set -g pane-border-style "fg=#64748b"
set -g pane-active-border-style "fg=#059669,bold"

# Borders are always one cell wide; heavy swaps in the thicker UTF-8 box
# glyphs, which falls back to ACS line drawing without UTF-8.
set -g pane-border-lines heavy

# catppuccin renders the window tabs with #T (pane title), so the tab showed
# whatever the running program set via OSC 2 and the window name appeared
# nowhere at all. #W is the window name. Dropping the powerline separators
# also drops the glyph-font dependency; weight and colour carry the active
# state instead, which survives any font.
set -g status-style "bg=#047857,fg=#ffffff"
set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_zoomed_flag, +,} "
set -g window-status-current-format "#[bg=#ffffff,fg=#047857,bold] #I #W#{?window_zoomed_flag, +,} #[default]"
# Activity was amber on the green field: ~2.6:1, and it read as a third state
# rather than a nudge. Underline says "something happened here" without
# introducing a hue that competes with the white current-window chip.
set -g window-status-activity-style "underscore"
set -g window-status-bell-style "bg=#f59e0b,fg=#0f172a,bold"

# -- modes and messages --------------------------------------------------------
# One family throughout: slate for structure, emerald for "this one", amber for
# "look here". No second cue where the colour already says it.
set -g mode-style "bg=#059669,fg=#ffffff"
set -g message-style "bg=#0f172a,fg=#f59e0b"
set -g message-command-style "bg=#0f172a,fg=#94a3b8"
set -g copy-mode-match-style "bg=#334155,fg=#e2e8f0"
set -g copy-mode-current-match-style "bg=#f59e0b,fg=#0f172a"
set -g display-panes-colour "#64748b"
set -g display-panes-active-colour "#059669"
set -g clock-mode-colour "#059669"
