[font]
size = 9.0

[font.normal]
family = "UDEV Gothic 35NFLG"
style = "Regular"

[font.bold]
family = "UDEV Gothic 35NFLG"
style = "Bold"

[font.italic]
family = "UDEV Gothic 35NFLG"
style = "Italic"

[font.bold_italic]
family = "UDEV Gothic 35NFLG"
style = "Bold Italic"

[window]
startup_mode = "Maximized"
decorations = "None"
opacity = 1.0

[scrolling]
history = 10000
multiplier = 3

[env]
TERM = "alacritty"

[shell]
program = "wsl.exe"
args = ["-e", "zsh", "-lc", "tmux -2 attach || tmux -2 new-session"]
