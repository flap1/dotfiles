pre-commit:
  parallel: true
  commands:
    secrets:
      run: gitleaks git --staged --redact --no-banner
    shellcheck:
      glob: "{*.sh,bin/*,packages/*.sh,lib/*.sh,.git_template/hooks/*,scripts/*.sh}"
      run: shellcheck {staged_files}
    shfmt:
      glob: "{bootstrap.sh,bin/*,packages/*.sh,lib/*.sh,scripts/*.sh,.git_template/hooks/*}"
      run: shfmt -i 4 -ci -s -d {staged_files}
    policy:
      run: bash scripts/policy.sh
